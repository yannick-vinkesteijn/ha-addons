# Only the Supervisor (ingress, 172.30.32.2) and the container itself (healthcheck) may reach the terminal.
# ttyd listens on 127.0.0.1:7682 only; other containers on the hassio network cannot get to it.
daemon off;
pid /run/nginx-pi-agent.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 7681 default_server;
    allow 172.30.32.2;
    allow 127.0.0.1;
    deny all;
    location / {
      proxy_pass http://127.0.0.1:7682;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
      proxy_buffering off;
    }
  }
}
