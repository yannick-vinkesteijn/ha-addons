name: Build add-ons

# Pull requests build (no push). Pushes to main and manual runs publish multi-arch images to ghcr.io.
# Adapted from home-assistant/apps-example, without tj-actions/changed-files or @master helpers.
on:
  pull_request:
    paths: ["pi-agent/**", "pyproject.toml", "uv.lock", ".github/workflows/build.yaml"]
  push:
    branches: [main]
    paths: ["pi-agent/**", "pyproject.toml", "uv.lock", ".github/workflows/build.yaml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP: pi-agent   # add-on directory; the image is ghcr.io/<owner>/<APP>

jobs:
  test:
    name: Lint, type check, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv run --group dev ruff check .
      - run: uv run --group dev ruff format --check .
      - run: uv run --group dev ty check
      - run: uv run --group dev pytest -q

  prepare:
    needs: test
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.info.outputs.image_name }}
      registry_prefix: ${{ steps.info.outputs.registry_prefix }}
      version: ${{ steps.info.outputs.version }}
      name: ${{ steps.info.outputs.name }}
      description: ${{ steps.info.outputs.description }}
      url: ${{ steps.info.outputs.url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read add-on info from config.yaml
        id: info
        run: |
          cfg="${APP}/config.yaml"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "architectures=$(yq -o=json -I=0 '.arch' "$cfg")"
            echo "version=$(yq '.version' "$cfg")"
            echo "name=$(yq '.name' "$cfg")"
            echo "description=$(yq '.description' "$cfg")"
            echo "url=$(yq '.url' "$cfg")"
            echo "image_name=${APP}"
            echo "registry_prefix=ghcr.io/${owner}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.info.outputs.image_name }}
          registry-prefix: ${{ steps.info.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ env.APP }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: ${{ github.event_name != 'pull_request' }}
          # A published version is immutable: bump `version` in config.yaml to release again.
          skip-existing: ${{ github.event_name != 'pull_request' }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
